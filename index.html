<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>カードアルバム</title>
    <link rel="icon" type="image/png" href="./assets/images/icon.png" />
    <link rel="apple-touch-icon" href="./assets/images/icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="カードアルバム" />
    <meta name="theme-color" content="#f6b5ce" />
    <link
      rel="stylesheet"
      href="./assets/css/developer-info.css?v=20261124-v179"
    />
    <script defer src="./assets/js/diagnostics.js?v=20261126-v180-r27"></script>
    <script
      defer
      src="./assets/js/app.js?v=20261126-v180-r31"
    ></script>
    <link rel="stylesheet" href="./assets/css/card-list-quantity.css?v=180-r22">
  <link rel="stylesheet" href="./assets/css/fade-unowned.css?v=180-r25">
  <style>
    footer .footer-note { line-height: 1.1; }
    footer .footer-links { flex-wrap: nowrap; align-items: center; justify-content: center; gap: clamp(2px, 1.5vw, 10px); }
    footer .footer-links button, footer .footer-links .contact-footer-link { white-space: nowrap; margin: 0; }
    footer .footer-support-links { margin-top: 0; }
    @media (max-width: 760px) {
      footer .footer-links button, footer .footer-links .contact-footer-link { font-size: clamp(9px, 2.6vw, 11px); padding: 6px 2px; }
    }
  </style>
</head>
  <body>
    <template id="page-album" data-body-class="">
      <header>
        <a aria-label="カードアルバムのトップへ" class="wordmark" href="./">
          <img alt="" class="header-card" hidden="" id="header-card" />
          <span id="header-title">カードアルバム</span>
        </a>
        <a
          id="guest-browse-link"
          hidden
          class="guest-browse-link"
          href="./?view=browse"
          >ログインせずに利用</a
        >
        <button
          aria-controls="nav"
          aria-expanded="false"
          aria-label="メニューを開く"
          class="menu-toggle"
          hidden=""
          id="menu-toggle"
        >
          <span></span><span></span><span></span>
        </button>
        <nav aria-label="アルバムの操作" hidden="" id="nav">
          <div
            aria-label="作品を切り替える"
            class="game-switch"
            id="game-switch"
            role="group"
          >
            <span aria-hidden="true" class="game-switch-slider"></span>
            <button aria-pressed="false" data-game="aikatsu">アイカツ！</button>
            <button aria-pressed="false" data-game="aipri">アイプリ</button
            ><button type="button" data-game="primagi" aria-pressed="false">
              プリマジ
            </button>
          </div>
          <button hidden="" id="ownership-export-open" type="button">
            所持状況を共有
          </button>
          <button hidden="" id="probability-open">確率確認</button>
          <button id="edit-nickname">ニックネームを変更</button>
          <button id="logout">ログアウト</button>
        </nav>
      </header>
      <main>
        <section class="auth" id="auth">
          <div class="intro">
            <h1>あなたのカードを<br />まとめて管理。</h1>
            <div
              aria-label="カードのスライド一覧"
              class="card-marquee"
              id="auth-art"
            >
              <div class="marquee-track">
                <div class="marquee-group"></div>
                <div aria-hidden="true" class="marquee-group"></div>
              </div>
            </div>
            <section
              id="login-catalog-series"
              class="login-catalog-series"
              aria-labelledby="login-catalog-series-title"
            >
              <h2 id="login-catalog-series-title">収録カード・コーデ</h2>
              <div class="login-series-group">
                <h3>カード</h3>
                <ul>
                  <li>アイカツ！アンコール</li>
                  <li>アイカツ！</li>
                  <li>アイカツスターズ！</li>
                  <li>アイカツフレンズ！</li>
                  <li>アイカツオンパレード！</li>
                  <li>アイカツプラネット！</li>
                  <li>アイカツアカデミー！</li>
                  <li>おねがいアイプリ</li>
                  <li>ひみつのアイプリ</li>
                </ul>
              </div>
              <div class="login-series-group">
                <h3>コーデ</h3>
                <ul>
                  <li>おねがいアイプリバース</li>
                  <li>ひみつのアイプリバース</li>
                  <li>ワッチャプリマジ！</li>
                </ul>
              </div>
            </section>
          </div>

          <div class="auth-panel">
            <section
              id="maintenance-panel"
              class="maintenance-panel"
              hidden=""
              aria-live="polite"
            >
              <span class="maintenance-symbol" aria-hidden="true">✦</span>
              <p class="maintenance-kicker">CARD ALBUM</p>
              <h2>メンテナンス中</h2>
              <p id="maintenance-message">
                ただ今システムのメンテナンスをしていますので、アルバムを開けません。
              </p>
              <div class="maintenance-schedule">
                <span>メンテナンス終了予定</span
                ><strong id="maintenance-end">未定</strong>
              </div>
              <p class="maintenance-wait">
                流れてくるカードを眺めて、<br />今しばらくお待ちください。
              </p>
              <button
                class="text-button"
                id="maintenance-refresh"
                type="button"
              >
                状況を確認する
              </button>
              <p id="maintenance-check-message" role="status"></p>
            </section>
            <div id="auth-normal-panel">
              <h2>カードアルバムへようこそ</h2>
              <div class="tabs">
                <button class="active" id="login-tab">ログイン</button
                ><button id="signup-tab">新規登録</button>
              </div>
              <form id="auth-form" novalidate="">
                <label
                  ><span id="login-identifier-label">アルバムID</span
                  ><input
                    aria-describedby="email-error"
                    autocapitalize="characters"
                    autocomplete="username"
                    id="email"
                    maxlength="254"
                    placeholder="アルバムID"
                    required=""
                    spellcheck="false"
                    type="text" /><span
                    class="field-error"
                    hidden=""
                    id="email-error"
                    role="alert"
                  ></span
                ></label>
                <label
                  >パスワード<input
                    aria-describedby="password-error"
                    autocomplete="current-password"
                    id="password"
                    maxlength="128"
                    minlength="8"
                    required=""
                    type="password" /><span
                    class="field-error"
                    hidden=""
                    id="password-error"
                    role="alert"
                  ></span
                ></label>
                <button class="primary" id="auth-submit" type="submit">
                  ログイン
                </button>
                <p class="account-retention-note">
                  1か月間ログイン・利用がないアカウントは所持記録とともに自動削除します。削除されたIDは再利用できません。
                </p>
              </form>
              <div hidden="" id="signup-flow">
                <ol aria-label="登録の手順" class="signup-steps">
                  <li data-signup-marker="id">ID発行</li>
                  <li data-signup-marker="password">パスワード</li>
                  <li data-signup-marker="nickname">ニックネーム</li>
                </ol>
                <section id="signup-id-step">
                  <h3>あなたのアルバムID</h3>
                  <p
                    class="muted"
                    id="signup-registration-status"
                    role="status"
                    aria-live="polite"
                  >
                    受付状況を確認しています…
                  </p>
                  <section
                    id="signup-invitation-notice"
                    class="registration-invitation"
                    aria-labelledby="invitation-notice-title"
                    hidden
                  >
                    <span class="registration-invitation-badge"
                      >招待受付中</span
                    >
                    <h3 id="invitation-notice-title">新規登録は招待制です</h3>
                    <p class="registration-invitation-intro">
                      システムへの負荷を抑えるため、現在は招待による新規登録のみ受け付けています。
                    </p>
                    <ol
                      class="registration-invitation-steps"
                      aria-label="招待のお申し込み方法"
                    >
                      <li>
                        <span
                          class="registration-invitation-number"
                          aria-hidden="true"
                          >1</span
                        ><span>制作者のXアカウントをフォロー</span>
                      </li>
                      <li>
                        <span
                          class="registration-invitation-number"
                          aria-hidden="true"
                          >2</span
                        ><span>DMで新規登録を希望する旨をご連絡ください</span>
                      </li>
                    </ol>
                    <a
                      class="registration-x-link"
                      href="https://x.com/coccot_"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        width="19"
                        height="19"
                        aria-hidden="true"
                      >
                        <path
                          fill="currentColor"
                          d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l8.2-9.4L.8 2h6.5l4.5 6.7L18.9 2Zm-1.1 18h1.7L6.4 3.9H4.6L17.8 20Z"
                        />
                      </svg>
                      <span>制作者のXを開く<small>@coccot_</small></span>
                      <svg
                        class="registration-x-arrow"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="M7 17 17 7M7 7h10v10" />
                      </svg>
                    </a>
                    <p class="registration-invitation-note">
                      招待URLをお持ちの方は、そのURLから登録へお進みください。
                    </p>
                  </section>
                  <button
                    class="primary"
                    id="issue-album-id"
                    type="button"
                    hidden
                  >
                    アルバムIDを発行
                  </button>
                  <aside
                    id="signup-issue-notice"
                    aria-labelledby="signup-issue-notice-title"
                    hidden
                  >
                    <h4 id="signup-issue-notice-title">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3 2 21h20L12 3Z" />
                        <path d="M12 9v5m0 3h.01" /></svg
                      >アルバムID発行時の注意事項
                    </h4>
                    <ul>
                      <li>
                        アルバムIDは自動発行され、指定や発行後の変更はできません。
                      </li>
                      <li>
                        発行前にインターネットの接続状況をご確認ください。
                      </li>
                      <li>
                        発行処理中は、ボタンの連続操作やページの再読み込み、ブラウザを閉じる操作をお控えください。
                      </li>
                      <li>
                        発行に失敗した場合は、時間をおいて再度お試しください。改善しない場合は、エラーメッセージを添えて運営者までお問い合わせください。
                      </li>
                    </ul>
                  </aside>
                  <button id="signup-issue-recheck" type="button" hidden>
                    発行状況を再確認
                  </button>
                  <div hidden="" id="issued-id-panel">
                    <div class="album-id-card">
                      <output id="issued-album-id"></output
                      ><button id="album-id-copy" type="button">コピー</button>
                    </div>
                    <p class="id-save-note">
                      ログインにはこのIDの入力が必要になります。スクショなどで保存してください。
                    </p>
                    <p class="muted id-expiry-note">
                      アルバムID発行から30分以内に登録を完了してください。ページを再読み込みした場合は、新規登録から続けられます。
                    </p>
                  </div>
                  <button
                    class="primary"
                    disabled=""
                    hidden=""
                    id="signup-password-start"
                    type="button"
                  >
                    パスワードを設定
                  </button>
                </section>
                <form hidden="" id="signup-password-form" novalidate="">
                  <h3>パスワードを設定</h3>
                  <p class="signup-id-reference"></p>
                  <label
                    >パスワード<input
                      autocomplete="new-password"
                      id="signup-password"
                      maxlength="128"
                      minlength="8"
                      required=""
                      type="password"
                  /></label>
                  <label
                    >パスワード確認<input
                      autocomplete="new-password"
                      id="signup-password-confirm"
                      maxlength="128"
                      required=""
                      type="password"
                  /></label>
                  <p class="muted">8〜128文字で設定してください。</p>
                  <p
                    class="field-error"
                    hidden=""
                    id="signup-password-error"
                    role="alert"
                  ></p>
                  <div class="signup-actions">
                    <button id="signup-back-id" type="button">戻る</button
                    ><button class="primary" type="submit">
                      ニックネームを登録
                    </button>
                  </div>
                </form>
                <form hidden="" id="signup-nickname-form" novalidate="">
                  <h3>ニックネームを登録</h3>
                  <p class="signup-id-reference"></p>
                  <label id="nickname-field"
                    >ニックネーム<input
                      aria-describedby="nickname-error"
                      autocomplete="nickname"
                      id="nickname"
                      maxlength="16"
                      placeholder="アルバムに表示する名前"
                      type="text" /><span
                      class="field-error"
                      hidden=""
                      id="nickname-error"
                      role="alert"
                    ></span
                  ></label>
                  <p class="id-save-note">
                    氏名、住所、電話番号、メールアドレスなどの個人情報は禁止です。
                  </p>
                  <label class="nickname-ack"
                    ><input
                      id="nickname-privacy-ack"
                      type="checkbox"
                    />個人情報を含まないことを確認しました</label
                  >
                  <div class="signup-actions">
                    <button class="primary" id="album-create" type="submit">
                      アルバムを作成する
                    </button>
                  </div>
                </form>
                <p class="field-error" id="signup-message" role="status"></p>
              </div>
              <button class="text-button" hidden="" id="forgot">
                パスワードを忘れた方</button
              ><button class="text-button" hidden="" id="resend">
                確認メールを再送する
              </button>
              <p id="auth-message" role="status"></p>
              <form hidden="" id="password-form">
                <label
                  >新しいパスワード<input
                    autocomplete="new-password"
                    id="new-password"
                    minlength="8"
                    required=""
                    type="password" /></label
                ><button class="primary">パスワードを変更</button>
              </form>
            </div>
          </div>
        </section>
        <section class="auth-result" hidden="" id="auth-result">
          <div class="auth-panel">
            <span
              aria-hidden="true"
              class="confirmation-icon"
              id="auth-result-icon"
              >✓</span
            >
            <h1 id="auth-result-title">登録できました</h1>
            <output
              class="created-album-id"
              hidden=""
              id="auth-result-album-id"
            ></output>
            <p id="auth-result-text" role="status"></p>
            <p
              class="account-retention-note"
              hidden=""
              id="auth-result-retention"
            >
              <strong
                >パスワードを忘れた場合、再設定やアカウントの復旧はできません。</strong
              ><br />
              アルバムIDとパスワードを、安全な場所に保存してください。<br /><br />
              1か月間ログイン・利用がないと、アカウントと所持記録を自動削除します。削除されたIDは再利用できません。
            </p>
            <button class="primary" id="auth-result-next">
              アルバムを選ぶ
            </button>
          </div>
        </section>
        <section hidden="" id="selection">
          <div class="selection-title">
            <span class="eyebrow">MY ALBUMS</span>
            <h1>どのアルバムを開く？</h1>
            <p id="account"></p>
            <p class="account-album-id" id="account-album-id"></p>
          </div>
          <div class="album-options">
            <button class="album aikatsu" data-game="aikatsu">
              <div class="album-images" id="aikatsu-art">
                <img
                  src="https://dcd.aikatsu.com/encore/images/cardlist/card/E1-01_PR.webp"
                  alt="オーロラキスキャミソール（星宮いちご）"
                  loading="eager"
                  decoding="async"
                /><img
                  src="https://dcd.aikatsu.com/encore/images/cardlist/card/E1-83_N.webp"
                  alt="イエローブロッサムトップス（和央パリン）"
                  loading="eager"
                  decoding="async"
                />
              </div>
              <span>アイカツ！アンコール</span></button
            ><button class="album aipri" data-game="aipri">
              <div class="album-images" id="aipri-art">
                <img
                  src="https://aipri.jp/card/img/oa4/OA4-001_O.webp"
                  alt="スマイルハートバズリウムピンク（いのり）"
                  loading="eager"
                  decoding="async"
                /><img
                  src="https://aipri.jp/card/img/oa4/OA4-005_O.webp"
                  alt="スマイルハートバズリウムレッド（ナナ）"
                  loading="eager"
                  decoding="async"
                />
              </div>
              <span>アイプリ</span>
            </button>
          </div>
        </section>
        <section hidden="" id="collection">
          <div class="collection-title">
            <div>
              <span class="eyebrow">CARD COLLECTION</span>
              <h1 id="game-title">おねがいアイプリ</h1>
            </div>
            <span class="pill" id="total"></span>
          </div>
          <div
            aria-label="アイプリの種類"
            class="family-tabs"
            hidden=""
            id="aipri-families"
            role="group"
          >
            <button aria-pressed="true" class="active" data-family="おねがい">
              おねがいアイプリ</button
            ><button aria-pressed="false" data-family="ひみつ">
              ひみつのアイプリ
            </button>
          </div>
          <div class="progress-card">
            <div>
              <span>カードの取得率</span><strong id="percent">0%</strong>
            </div>
            <div class="progress-track"><span id="progress-bar"></span></div>
            <div class="progress-bottom">
              <p id="progress-count"></p>
              <button
                aria-controls="series-progress"
                aria-expanded="false"
                aria-label="弾ごとの取得率を表示"
                class="text-button"
                id="progress-details"
              >
                <span aria-hidden="true" class="progress-chevron"></span>
              </button>
            </div>
            <div aria-live="polite" id="filtered-rate"></div>
          </div>
          <div class="series-progress" hidden="" id="series-progress"></div>
          <details class="filter-panel" id="filter-panel">
            <summary>
              カードを絞り込む <span id="filter-summary"></span>
            </summary>
            <div class="filter-content">
              <label class="search-label"
                >フリーワード検索<input
                  id="query"
                  placeholder="カード名・コードなど"
                  type="search"
                /><button
                  aria-label="フリーワード検索を解除"
                  class="filter-clear"
                  id="clear-query"
                  type="button"
                >
                  解除
                </button></label
              >
              <div class="filter-grid" id="filters"></div>
              <div class="filter-footer">
                <button class="text-button" id="reset">
                  すべての絞り込みを解除
                </button>
              </div>
            </div>
          </details>
          <div
            aria-label="適用中の絞り込み"
            aria-live="polite"
            class="active-filters"
            id="active-filters"
          ></div>
          <div class="ownership-toolbar">
            <div aria-label="所持状態" class="owned-tabs" role="group">
              <span aria-hidden="true" class="owned-tabs-slider"></span>
              <button class="active" data-owned="all">すべて</button
              ><button data-owned="yes">持っている</button
              ><button data-owned="no">持っていない</button>
            </div>
          </div>
          <div class="results-heading">
            <h2 id="result-count"></h2>
            <div class="results-controls card-display-toolbar">
              <label class="display-count"
                ><span class="display-control-label">並び順</span
                ><select id="card-sort" aria-label="カード一覧の並び順">
                  <option value="official">標準順</option>
                  <option value="code">番号順</option>
                  <option value="name">カード名順</option>
                  <option value="character">キャラ順</option>
                  <option value="quantity">所持数順</option>
                </select></label
              >
              <label class="display-count">
                <span class="display-control-label">表示件数</span>
                <select aria-label="一覧の表示件数" id="page-size">
                  <option value="20">20枚</option>
                  <option value="50">50枚</option>
                  <option value="100">100枚</option>
                  <option value="all">すべて</option>
                </select>
              </label>
              <div
                aria-label="カード一覧の列数"
                class="mobile-column-control"
                role="group"
              >
                <span class="mobile-column-label">カードの並び</span>
                <div class="mobile-column-buttons">
                  <button
                    aria-pressed="false"
                    data-card-columns="2"
                    type="button"
                  >
                    2列
                  </button>
                  <button
                    aria-pressed="true"
                    data-card-columns="3"
                    type="button"
                  >
                    3列
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-grid" data-mobile-columns="3" id="cards"></div>
          <p hidden="" id="empty">
            見つかりませんでした。条件を変えて探してみてください。
          </p>
          <div class="pagination">
            <button id="prev">前のページ</button>
            <nav aria-label="カード一覧のページ" id="page-numbers"></nav>
            <button id="next">次のページ</button>
          </div>
          <div aria-label="カード情報の更新状況" class="collection-status">
            <div class="sync-indicator" id="sync-indicator">
              <span aria-hidden="true" class="sync-spinner" hidden=""></span>
              <p class="muted" id="sync-status" role="status"></p>
            </div>
            <p class="notice" hidden="" id="data-warning"></p>
          </div>
        </section>
        <section class="probability-page" hidden="" id="probabilities">
          <div class="collection-title">
            <div>
              <span class="eyebrow">MY CARD STATS</span>
              <h1 id="probability-title">確率確認</h1>
            </div>
            <button
              type="button"
              id="probability-back"
              class="album-tool-close"
              aria-label="確率確認を閉じる"
            >
              ×
            </button>
          </div>
          <p class="muted">

    <template id="page-faq" data-body-class=""><header><a class="wordmark" href="./">カードアルバム</a><a class="back-link" href="./">アルバムへ戻る</a></header><main class="contact-main"><section class="contact-panel"><span class="eyebrow">FAQ</span><h1>よくある質問</h1><section id="contact-faq" class="contact-faq"><p class="muted">カードアルバムの使い方や、困ったときの対処方法をご確認いただけます。</p><label for="faq-search">質問を検索</label><input id="faq-search" type="search" placeholder="例：ログイン、エラーコード" autocomplete="off"><p id="faq-count" role="status" aria-live="polite"></p><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg></span><span>カードアルバムについて</span></summary><details class="faq-question"><summary>Q. カードアルバムとは？</summary><p>A. カードやコーデの検索・所持記録・QRコード保管ができる個人運営の非公式サイトです。</p></details><details class="faq-question"><summary>Q. 公式サービスですか？</summary><p>A. 各作品の公式運営会社とは関係ありません。ゲームデータとの連携も行っていません。</p></details><details class="faq-question"><summary>Q. 対応作品は？</summary><p>A. アイカツ！アンコール、ひみつのアイプリ、おねがいアイプリ、アイプリバース、ワッチャプリマジ！、アイカツALLです。機能は作品によって異なります。</p></details><details class="faq-question"><summary>Q. 複数端末で使えますか？</summary><p>A. 同じアルバムIDでログインしてください。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><span>アカウント・ログイン</span></summary><details class="faq-question"><summary>Q. IDを忘れました</summary><p>A. 保存した画像やメモをご確認ください。</p></details><details class="faq-question"><summary>Q. パスワードを忘れました</summary><p>A. 現在、再設定や復旧には対応していません。</p></details><details class="faq-question"><summary>Q. 正しいIDでもログインできません</summary><p>A. 通信環境を確認し、時間をおいてお試しください。改善しない場合はエラーコードを添えてお問い合わせください。</p></details><details class="faq-question"><summary>Q. 長期間ログインしないと削除されますか？</summary><p>A. 自動削除機能は現在停止しています。再開時はお知らせをご確認ください。</p></details><details class="faq-question"><summary>Q. アカウントを削除したい</summary><p>A. 詳細設定から削除できます。削除後の復元はできません。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></span><span>カード・コーデの検索</span></summary><details class="faq-question"><summary>Q. カードが見つかりません</summary><p>A. 作品・弾数・絞り込み条件をご確認ください。未登録の場合は追加依頼をお送りください。</p></details><details class="faq-question"><summary>Q. 裏面を見たい</summary><p>A. 裏面画像が登録されている場合は詳細画面で切り替えられます。</p></details><details class="faq-question"><summary>Q. 画像が表示されません</summary><p>A. 通信状況や画像の登録状況をご確認ください。</p></details><details class="faq-question"><summary>Q. アイカツALLとは？</summary><p>A. 歴代アイカツシリーズ6作品のカードをまとめた機能です。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 4 12C-1 5 8 1 12 7c4-6 13-2 8 5Z"/></svg></span><span>所持状況・お気に入り</span></summary><details class="faq-question"><summary>Q. 複数枚登録できますか？</summary><p>A. 所持数の増減ボタンで登録できます。</p></details><details class="faq-question"><summary>Q. 登録を取り消したい</summary><p>A. 所持数を0にするか未所持に変更してください。</p></details><details class="faq-question"><summary>Q. 取得率とは？</summary><p>A. 対象の登録種類数に対する所持済み種類数の割合です。複数枚所持しても種類数は増えません。</p></details><details class="faq-question"><summary>Q. 取得率が下がりました</summary><p>A. 新規カードの追加などで計算対象が増える場合があります。</p></details><details class="faq-question"><summary>Q. お気に入りとは？</summary><p>A. 所持状況とは別に気になるカードなどを記録できます。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3-6 4 3 5 3-2v11h8V10l3 2 3-5-6-4a4 4 0 0 1-8 0Z"/></svg></span><span>コーデ・パーツ管理</span></summary><details class="faq-question"><summary>Q. パーツごとに登録できますか？</summary><p>A. 対応作品ではパーツ単位で登録できます。</p></details><details class="faq-question"><summary>Q. 全パーツを登録しても所持済みになりません</summary><p>A. 詳細設定と各パーツの登録状況をご確認ください。</p></details><details class="faq-question"><summary>Q. パーツ情報が実物と違います</summary><p>A. 確認中の暫定情報の場合があります。コーデ情報の修正依頼をお送りください。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h3v3h4v4h-7z"/></svg></span><span>QRコード</span></summary><details class="faq-question"><summary>Q. 登録方法は？</summary><p>A. 対象のQR登録ボタンからカメラで読み取ってください。</p></details><details class="faq-question"><summary>Q. 撮影画像は保存されますか？</summary><p>A. 撮影画像ではなく読み取ったデータを保存します。</p></details><details class="faq-question"><summary>Q. 読み取れません</summary><p>A. カメラの許可、明るさ、ピント、QR全体が映っているかをご確認ください。</p></details><details class="faq-question"><summary>Q. ゲームで読み取れません</summary><p>A. 画面の明るさや表示サイズを調整してください。ゲームでの利用は保証していません。</p></details><details class="faq-question"><summary>Q. 登録上限は？</summary><p>A. 詳細設定で現在の登録数と上限をご確認ください。</p></details><details class="faq-question"><summary>Q. 上限を増やしたい</summary><p>A. 個別のお問い合わせによる引き上げには原則対応していません。</p></details><details class="faq-question"><summary>Q. 上限が下がると削除されますか？</summary><p>A. 上限変更のみを理由に登録済みQRは削除されません。新規登録は制限されます。</p></details><details class="faq-question"><summary>Q. 他人のQRを登録できますか？</summary><p>A. ご自身が所有するQRのみ登録してください。</p></details><details class="faq-question"><summary>Q. QRを削除したい</summary><p>A. QR表示画面や詳細設定から削除できます。</p></details><details class="faq-question"><summary>Q. QRは公開されますか？</summary><p>A. 所持状況の共有機能では公開されません。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M5 16h6m3-6h4m-4 4h4"/></svg></span><span>セーブコード・フレンドカード</span></summary><details class="faq-question"><summary>Q. セーブ・フレカとは？</summary><p>A. セーブコードやフレンドカードを管理する機能です。</p></details><details class="faq-question"><summary>Q. 複数登録できますか？</summary><p>A. 登録上限の範囲内で登録できます。</p></details><details class="faq-question"><summary>Q. ゲームデータを復元できますか？</summary><p>A. QRの保管機能であり、ゲームデータの復元は保証しません。</p></details><details class="faq-question"><summary>Q. 一括削除の対象ですか？</summary><p>A. 通常のQR一括削除ではセーブコード・フレンドカードは対象外です。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18l-4-4m4 12H3l4 4"/></svg></span><span>交換希望</span></summary><details class="faq-question"><summary>Q. 交換希望とは？</summary><p>A. 交換に出したいもの、入手したいものを記録する機能です。</p></details><details class="faq-question"><summary>Q. 交換相手を探せますか？</summary><p>A. 交換の仲介は行っていません。</p></details><details class="faq-question"><summary>Q. 所持数も変わりますか？</summary><p>A. 別の情報として管理されます。交換成立後はご自身で所持数を変更してください。</p></details><details class="faq-question"><summary>Q. 画像を作れますか？</summary><p>A. 対応作品では交換希望画像を作成できます。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="m7 11 10-5M7 13l10 5"/></svg></span><span>所持状況の共有</span></summary><details class="faq-question"><summary>Q. 共有方法は？</summary><p>A. 共有URLや共有用画像をご利用ください。</p></details><details class="faq-question"><summary>Q. すべての情報が公開されますか？</summary><p>A. 設定した共有対象が公開されます。パスワードや登録QRは公開されません。</p></details><details class="faq-question"><summary>Q. 公開を停止したい</summary><p>A. 共有設定から停止できます。</p></details><details class="faq-question"><summary>Q. 他人が所持数を変更できますか？</summary><p>A. 共有ページは閲覧用です。</p></details><details class="faq-question"><summary>Q. URLなしで画像を作れますか？</summary><p>A. 共有URLを発行せずに画像を作成できます。</p></details><details class="faq-question"><summary>Q. 画像の作成方法は？</summary><p>A. 一覧の「所持状況を共有」から「共有用画像を作成」を選択してください。</p></details><details class="faq-question"><summary>Q. 画像の件数上限は？</summary><p>A. 1枚最大100件で、超える場合は複数枚に分割されます。</p></details><details class="faq-question"><summary>Q. 未所持だけ表示できますか？</summary><p>A. 画像作成時に所持済みのみ・未所持のみを選択できます。</p></details><details class="faq-question"><summary>Q. 画像のQRとは？</summary><p>A. 共有ページまたはカードアルバムへの案内です。共有設定により異なります。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H4v18h16v-8M10 14l2-5 7-7 3 3-7 7z"/></svg></span><span>カード・コーデ情報の修正・追加</span></summary><details class="faq-question"><summary>Q. 未登録カードを見つけました</summary><p>A. カード情報の修正・追加依頼から番号や名称をお知らせください。</p></details><details class="faq-question"><summary>Q. 未登録コーデを見つけました</summary><p>A. コーデ情報の修正・追加依頼から名称や登場時期をお知らせください。</p></details><details class="faq-question"><summary>Q. 情報が間違っています</summary><p>A. 対象の番号・名称と正しい情報をお知らせください。</p></details><details class="faq-question"><summary>Q. 新規カードはいつ追加されますか？</summary><p>A. 情報確認後に順次追加します。個人運営のため時間がかかる場合があります。</p></details><details class="faq-question"><summary>Q. 公式と名称が異なります</summary><p>A. 検索や管理のため独自分類を使用する場合があります。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v7m0 4v1"/></svg></span><span>不具合・通信エラー</span></summary><details class="faq-question"><summary>Q. 通信が混み合っています・タイムアウト</summary><p>A. 繰り返し操作せず時間をおいてください。保存操作の場合は再読み込みして結果を確認してから再操作してください。</p></details><details class="faq-question"><summary>Q. カードは表示されるのにコーデが表示されません</summary><p>A. 機能ごとに通信状況が異なる場合があります。絞り込みを確認し、時間をおいて再読み込みしてください。</p></details><details class="faq-question"><summary>Q. 読み込みが終わりません</summary><p>A. 通信環境を確認し、処理が長時間終わらない場合は再読み込みしてください。未保存の入力は失われる場合があります。</p></details><details class="faq-question"><summary>Q. 所持数の変更・保存に失敗しました</summary><p>A. 処理がサーバーで完了している可能性もあります。再操作する前に再読み込みして実際の登録数を確認してください。</p></details><details class="faq-question"><summary>Q. 登録情報が消えたように見えます</summary><p>A. 読み込み失敗や別アカウントの可能性があります。IDと絞り込みを確認してください。再登録や削除を急がずお問い合わせください。</p></details><details class="faq-question"><summary>Q. 突然ログアウトしました</summary><p>A. 通信や認証の状態によって再ログインが必要になる場合があります。正しいIDで再ログインしてください。</p></details><details class="faq-question"><summary>Q. エラーコードとは？</summary><p>A. 障害調査に使用する識別情報です。表示されたコードを控えてお問い合わせください。</p></details><details class="faq-question"><summary>Q. エラーコードがありません</summary><p>A. 発生日時、画面、操作内容、表示メッセージをお知らせください。</p></details><details class="faq-question"><summary>Q. アップデート後に動きません</summary><p>A. ページを再読み込みしてください。キャッシュ削除はログイン情報を確認してから行ってください。</p></details><details class="faq-question"><summary>Q. 共有画像が作成・保存できません</summary><p>A. 対象件数を減らし、端末の空き容量や共有先アプリの状態をご確認ください。</p></details><details class="faq-question"><summary>Q. QR登録に失敗しました</summary><p>A. 上限、カメラ許可、通信状態を確認し、再登録前に登録済みか確認してください。</p></details><details class="faq-question"><summary>Q. お問い合わせ送信に失敗しました</summary><p>A. 入力内容を控え、受付番号の表示を確認してください。連続送信は避けてください。</p></details><details class="faq-question"><summary>Q. サイトにアクセスできません</summary><p>A. 通信環境や運営のお知らせをご確認ください。時間をおいて再度お試しください。</p></details><details class="faq-question"><summary>Q. 不具合報告に必要な情報は？</summary><p>A. 発生日時、端末・ブラウザ、対象作品、操作手順、エラーコードをお知らせください。パスワードやQRの内容は送らないでください。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6 4-4 4 4-4 4-4-1L5 21l-3-3 9-10-1-4 4-2z"/></svg></span><span>メンテナンス・アップデート</span></summary><details class="faq-question"><summary>Q. メンテナンス中は使えますか？</summary><p>A. 内容によって一部またはすべての機能が制限されます。</p></details><details class="faq-question"><summary>Q. 開始直前の操作は保存されますか？</summary><p>A. 正常に保存されない場合があります。余裕を持って操作を終了してください。</p></details><details class="faq-question"><summary>Q. 終了時刻は？</summary><p>A. 運営のお知らせをご確認ください。作業状況により変更される場合があります。</p></details><details class="faq-question"><summary>Q. 更新内容は？</summary><p>A. サイト内の更新情報やお知らせをご確認ください。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v13H9l-6 4zM7 9h10m-10 4h7"/></svg></span><span>お問い合わせ・機能追加</span></summary><details class="faq-question"><summary>Q. 返信はどこで確認できますか？</summary><p>A. ログインして送信した場合はサイト内のお知らせに表示されます。</p></details><details class="faq-question"><summary>Q. 返信は公開されますか？</summary><p>A. 個別返信は対象利用者のみ閲覧できます。</p></details><details class="faq-question"><summary>Q. 返信はいつですか？</summary><p>A. 個人運営のため時間がかかる場合があります。</p></details><details class="faq-question"><summary>Q. 機能追加を希望します</summary><p>A. 機能追加依頼からご要望をお送りください。すべての要望への対応を保証するものではありません。</p></details></details><details class="faq-category"><summary><span class="faq-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-5 8-9 10-4-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg></span><span>登録情報・プライバシー</span></summary><details class="faq-question"><summary>Q. キャッシュ削除で所持情報は消えますか？</summary><p>A. 正常にサーバーへ保存された情報は消えません。再ログインが必要になる場合があります。</p></details><details class="faq-question"><summary>Q. パスワードを伝える必要は？</summary><p>A. ありません。お問い合わせにも記載しないでください。</p></details><details class="faq-question"><summary>Q. 情報の取り扱いは？</summary><p>A. 利用規約とプライバシーポリシーをご確認ください。</p></details></details><div class="faq-help support-nav"><p>よくある質問で解決しない場合</p><a class="support-nav-link" href="./?view=contact"><svg class="support-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="support-nav-copy"><strong>お問い合わせ</strong><span>運営者に質問・不具合報告を送る</span></span><svg class="support-nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a></div></section></section></main><footer><div class="footer-links"><a class="contact-footer-link" href="./?view=contact">お問い合わせ</a><a class="contact-footer-link" href="./">アルバムへ戻る</a></div></footer></template>
