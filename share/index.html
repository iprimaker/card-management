<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    /><meta name="referrer" content="no-referrer" /><meta
      name="robots"
      content="noindex,nofollow"
    /><title>所持状況を見る｜カードアルバム</title>
    <link rel="icon" href="../assets/images/favicon.png" /><link
      rel="stylesheet"
      href="../assets/css/style.css"
    /><link rel="stylesheet" href="../assets/css/public-share.css?v=20261017" />
    <script defer src="../assets/js/vendor/supabase.js"></script
    ><script defer src="../assets/js/config.js"></script
    ><script defer src="../assets/js/catalog-cache.js"></script
    ><script defer src="../assets/js/image-resolution.js"></script
    ><script defer src="../assets/js/public-share.js?v=20261017"></script>
  </head>
  <body class="public-share"
    ><header class="public-header"><a href="../">カードアルバム</a><span>閲覧専用</span></header
    ><main>
      <section id="public-unavailable" hidden
        ><h1>このアルバムは閲覧できません</h1><p>URLや公開設定をご確認ください。</p></section
      >
      <p id="public-status" role="status">所持状況を読み込み中…</p>
      <section id="public-album" hidden
        ><div class="public-heading"
          ><h1 id="public-title">公開アルバム</h1
          ><button type="button" id="public-refresh">再読み込み</button></div
        ><nav id="public-scopes" aria-label="公開中のアルバム"></nav
        ><div class="public-progress"
          ><span>総取得率</span><strong id="public-rate"></strong><p id="public-count"></p
        ></div>
        <details class="public-filters"
          ><summary>絞り込む<span id="public-filter-count"></span></summary
          ><div
            ><label
              >フリーワード検索<input
                id="public-query"
                type="search"
                placeholder="名前・コードなど"
                autocomplete="off" /></label
            ><div id="public-fields"></div
            ><button id="public-reset" type="button">すべての絞り込みを解除</button></div
          ></details
        >
        <div id="public-owned" role="group" aria-label="所持状況"></div
        ><div class="public-toolbar"
          ><p id="public-found"></p
          ><label
            >表示件数<select id="public-size"
              ><option>20</option
              ><option>50</option
              ><option>100</option
              ><option value="all">すべて</option></select
            ></label
          ></div
        ><div id="public-cards"></div
        ><p id="public-empty" hidden>見つかりませんでした。条件を変えて探してみてください。</p
        ><nav id="public-pages" aria-label="ページ切り替え"></nav
      ></section>
      <a class="public-signup-banner" href="../#signup"
        ><strong>あなたのカードも、アルバムに。</strong><span>所持状況を管理・共有する</span
        ><b>新規登録はこちら ›</b></a
      > </main
    ><dialog id="public-detail"
      ><button type="button" id="public-close" aria-label="閉じる">×</button
      ><div id="public-detail-content"></div></dialog></body
></html>
