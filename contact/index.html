<!doctype html>

<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>お問い合わせ｜カードアルバム</title>
    <link href="../assets/images/favicon.svg" rel="icon" />
    <link href="../assets/css/style.css?v=20261012-manual-db" rel="stylesheet" />
    <link href="../assets/css/dropdowns.css?v=20261012-manual-db" rel="stylesheet" />
    <script defer="" src="../assets/js/dropdowns.js?v=20261012-manual-db"></script>
    <link href="../assets/css/contact.css?v=20261012-manual-db" rel="stylesheet" />
    <script defer="" src="../assets/js/vendor/supabase.js?v=20261012-manual-db"></script>
    <script defer="" src="../assets/js/config.js?v=20261012-manual-db"></script>
    <script defer="" src="../assets/js/site-info.js?v=20261012-manual-db"></script>
    <script defer src="../assets/js/maintenance.js?v=20261012-maintenance"></script>
    <script defer="" src="../assets/js/contact.js?v=20261012-maintenance"></script>
    <link rel="stylesheet" href="../assets/css/album-polish.css?v=20261017-card-modal-scroll-fix" /><script>
      try { document.documentElement.classList.toggle("contact-aipri", new URLSearchParams(location.search).get("theme") === "aipri" || (!new URLSearchParams(location.search).has("theme") && sessionStorage.getItem("card-active-theme") === "aipri")); } catch {}
    </script></head
  >
  <body>
    <header>
      <a class="wordmark" href="../">カードアルバム</a
      ><a class="back-link" href="../">アルバムへ戻る</a>
    </header>
    <main class="contact-main">
      <section class="contact-panel" id="contact-panel">
        <span class="eyebrow">CONTACT</span>
        <h1>お問い合わせ</h1>
        <p class="muted"> カード情報の修正やサイトに関するご相談をお送りください。 </p>
        <form id="contact-form">
          <div hidden="" id="contact-album-field">
            <label>アルバムID</label><output class="created-album-id" id="contact-album-id"></output
            ><small>ログイン中のアルバムIDでお問い合わせを送信します。</small>
          </div>
          <label
            >メールアドレス<input
              autocomplete="email"
              id="contact-email"
              maxlength="254"
              required=""
              type="email"
            /><small>連絡を受け取れるアドレスを入力してください。</small></label
          ><label
            >お名前・ニックネーム <small>任意</small
            ><input autocomplete="name" id="contact-name" maxlength="40" type="text" /></label
          ><label
            >お問い合わせの種類<select id="contact-category">
              <option value="question">使い方について</option>
              <option value="correction">カード情報の修正</option>
              <option value="other">その他</option>
            </select></label
          ><label
            >お問い合わせ内容<textarea
              id="contact-message"
              maxlength="3000"
              minlength="10"
              placeholder="対象のカードコードや、起きている状況などをご記入ください。"
              required=""
              rows="8"
            ></textarea
            ><small
              >10〜3,000文字。パスワードや確認メールのURLは記載しないでください。</small
            ></label
          ><label aria-hidden="true" class="contact-honeypot"
            >Website<input autocomplete="off" id="contact-website" tabindex="-1" /></label
          ><label class="consent"
            ><input id="contact-consent" required="" type="checkbox" /><span
              >プライバシーポリシーを確認し、入力内容の取り扱いに同意します。<button
                class="text-button"
                data-info="privacy"
                type="button"
              >
                内容を確認
              </button></span
            ></label
          >
          <p id="contact-error" role="status"></p>
          <button class="primary" id="contact-submit" type="submit"> 送信する </button>
        </form>
      </section>
      <section class="contact-panel" hidden="" id="contact-complete">
        <span aria-hidden="true" class="confirmation-icon">✓</span>
        <h1>送信しました</h1>
        <p>お問い合わせを受け付けました。</p>
        <p class="muted">受付番号</p>
        <p class="contact-reference" id="contact-reference"></p>
        <a class="contact-return" href="../">アルバムへ戻る</a>
      </section>
    </main>
    <footer>
      <div class="footer-links">
        <button data-info="terms">利用規約</button
        ><button data-info="privacy">プライバシーポリシー</button
        ><button data-info="about">このサイトについて</button>
      </div>
    </footer>
    <dialog aria-labelledby="info-title" id="info-dialog">
      <div class="modal-top">
        <h2 id="info-title"></h2>
        <button aria-label="閉じる" id="legal-close">×</button>
      </div>
      <div class="legal-body" id="info-body"></div>
    </dialog>
  </body>
</html>
